[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trama"]

[project]
name = "trama"
version = "0.3.0"
description = "Trama es un CLI de codigo abierto diseñado para generar rapidamente scaffolding de aplicacion web modulares."
readme = "README.md"
requires-python = ">=3.14.6"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.159.1",
    "jinja2>=3.1.6",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.14.1",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "sqlalchemy>=2.1.6",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
trama = "trama.cli:main"
